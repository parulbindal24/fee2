<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Chess Board</title>
    <style>
        /* Center the board on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            border: 4px solid #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .square {
            width: 100%;
            height: 100%;
        }

        .white {
            background-color: #ffffff;
        }

        .black {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="chessboard">
  
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
  
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
  
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
  
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>

        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
  
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
 
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
        <div class="square white"></div><div class="square black"></div><div class="square white"></div><div class="square black"></div>
  
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
        <div class="square black"></div><div class="square white"></div><div class="square black"></div><div class="square white"></div>
    </div>

</body>
</html>
